<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Recordings - Call Center Bot Admin</title>
    <!-- {% extends "base.html" %} Jinja-like comment -->
</head>
<body>
    <!-- {% block content %} Jinja-like comment -->
    <h1>Manage Audio Recordings</h1>

    <h2>Upload New Recording</h2>
    <!--
        In a real Flask app, the action would be url_for('manage_recordings')
        <form method="POST" enctype="multipart/form-data" action="{{ url_for('manage_recordings') }}">
    -->
    <form method="POST" enctype="multipart/form-data" action="/recordings">
        <input type="file" name="file" required>
        <input type="submit" value="Upload Recording">
    </form>

    <h2>Uploaded Recordings</h2>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Filename</th>
                <th>Upload Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Example of how recordings might be displayed if passed from Flask -->
            <!--
            {% for recording in recordings %}
            <tr>
                <td>{{ recording.id }}</td>
                <td>{{ recording.filename }}</td>
                <td>{{ recording.upload_date }}</td>
                <td>{{ recording.status }}</td>
                <td>
                    <a href="{{ url_for('view_transcript', recording_id=recording.id) }}">View Transcript</a> |
                    <a href="{{ url_for('annotate_recording', recording_id=recording.id) }}">Annotate</a> |
                    <a href="{{ url_for('download_recording', recording_id=recording.id) }}">Download</a>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="5">No recordings found.</td>
            </tr>
            {% endfor %}
            -->
            <tr>
                <td colspan="5"><i>List of uploaded recordings will appear here. (Example: recording_001.wav | 2023-10-27 | Pending Review | Actions )</i></td>
            </tr>
        </tbody>
    </table>

    <p><a href="/">Back to Dashboard</a></p>
    <!-- {% endblock %} Jinja-like comment -->
</body>
</html>
