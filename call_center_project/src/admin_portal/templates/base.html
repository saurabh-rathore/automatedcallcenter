<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Call Center Bot Admin Portal{% endblock %}</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #f4f4f4; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: #007bff; color: white; padding: 1em; text-align: center; }
        header h1 { margin: 0; }
        nav ul { list-style-type: none; padding: 0; margin: 0.5em 0 0 0; }
        nav ul li { display: inline; margin-right: 20px; }
        nav ul li a { color: white; text-decoration: none; font-weight: bold; }
        nav ul li a:hover { text-decoration: underline; }
        .user-info { float: right; color: #f0f0f0; font-size: 0.9em; margin-right: 1em; }
        main.container { flex: 1; background-color: white; padding: 20px; margin: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        footer { background-color: #333; color: white; text-align: center; padding: 1em 0; margin-top: auto; }
        h1, h2 { color: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f0f0f0; }
        form input[type="file"], form input[type="submit"], form button, form input[type="text"], form input[type="password"], form input[type="number"], form textarea {
            margin-top: 5px; margin-bottom: 10px; padding: 8px; border-radius: 4px; border: 1px solid #ccc;
        }
        form input[type="submit"], form button { background-color: #007bff; color: white; cursor: pointer; }
        form input[type="submit"]:hover, form button:hover { background-color: #0056b3; }
        fieldset { margin-top: 20px; border: 1px solid #ccc; padding: 15px; border-radius: 5px; }
        legend { font-weight: bold; color: #0056b3; }
    </style>
</head>
<body>
    <header>
        <!-- User info and Login/Logout links would be dynamically rendered here by the server -->
        <!-- For example, if using app.py's _get_nav_links_html() and _render_base_template(): -->
        <!-- Python in app.py:
            nav_links_html = ""
            if mock_session.get('logged_in_user'):
                nav_links_html += f"<span class='user-info'>User: {mock_session['logged_in_user']} (<a href='/logout'>Logout</a>)</span>"
            else:
                nav_links_html += "<span class='user-info'><a href='/login'>Login</a></span>"
        -->
        <!-- This conceptual nav_links_html would then be part of the header string in _render_base_template -->
        <div class="user-info">
            <!-- Placeholder: (Login/Logout link and User Info would appear here) -->
            <!-- This part is dynamically generated by _get_nav_links_html() in the app.py placeholder -->
        </div>
        <h1>Call Center Bot - Admin Portal</h1>
        <nav>
            <ul>
                <!-- Conceptual links, also dynamically generated by _get_nav_links_html() in app.py -->
                <li><a href="/">Dashboard</a></li>
                <li><a href="/manage_recordings_stt">Transcribed Recordings</a></li>
                <li><a href="/nlu_management">NLU Management</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        {% block content %}
        <!-- Default content if a sub-template doesn't override this block -->
        <p>Welcome to the Admin Portal. Please login to access features.</p>
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2023-2024 Call Center Bot Project</p>
    </footer>
</body>
</html>
